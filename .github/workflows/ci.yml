name: CI

on:
  pull_request:
    # `feat/**` too: an effort built with large-feature-branch-workflow merges
    # each slice into its integration branch `feat/<slug>`, and those slices
    # are merged without waiting for a human. Without this they merged with no
    # CI at all — no tests, no artifact check.
    branches: [develop, main, 'feat/**']
  # On `develop` as well, and the reason is the caches rather than the tests.
  # A cache written by a pull request is scoped to `refs/pull/<N>/merge` and
  # **no other branch can read it** — a pull request reads its base branch's
  # caches and the default branch's, never another pull request's. With CI on
  # `pull_request` alone, nothing is ever written under `refs/heads/develop`
  # and every run starts cold.
  #
  # Measured in nxgt-data on 2026-09-20, where this was learned: 173 cache
  # entries, seven separate copies of mongod — one per pull request — and the
  # only entry on `refs/heads/develop` was `bun-`. The version pull request
  # failed twice in a row under that load, on different tests each time, which
  # is load and not a regression.
  #
  # This repository caches Bun and, since `@nxgt/janus-mongo`, mongod; this
  # trigger is what makes those caches readable from every pull request.
  push:
    branches: [develop]

# A pull request's new push supersedes its run in progress. A push to
# `develop` never does: each one is in a group of its own, by run id, because
# that run is what writes the caches every pull request reads — and a group
# with `cancel-in-progress: false` still cancels a run left *pending* in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref != 'refs/heads/develop' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    # GitHub-hosted. The repository is public, so these minutes are free.
    runs-on: ubuntu-latest
    # Measured on 30 runs up to 2026-09-27: 6 to 8½ minutes, of which
    # `bun install` took 2½ to 3½ — a Redis nothing used, compiled by a
    # postinstall the setup action now skips; the install now takes about 4 s
    # (#91) — and a cold Redis build about 2. Past 30, it is hung, and
    # the six-hour default would hold the runner for nothing.
    timeout-minutes: 30
    # @nxgt/janus-drizzle's specs run on a real PostgreSQL here, and on PGlite
    # everywhere else. PGlite runs one connection, so the concurrency cases —
    # twenty redemptions of one token — are serialised there and pass without
    # the lock that makes them pass here: measured, a `consumeToken` without
    # `for update` passes on PGlite and fails on this server every time.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: janus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/develop` needs the base branch.
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      # The Biome bun.lock resolved, as `bun run check` runs it locally: one
      # version, the one biome.json's $schema names, and never `latest`.
      - name: Lint code
        run: bunx biome ci
      # A changeset naming a private package is consumed by `changeset
      # version` and published by nothing: the release stays in version mode
      # (#51 → #53). A typo in a package name is the same release that never
      # happens. Checked on every run, and early — it takes milliseconds. The
      # release branch has no changesets left, so it passes there.
      - name: Changesets name published packages
        run: bun run changeset:private
      # Build FIRST. Every package's `exports` points at `./dist/*`, so on a
      # clean checkout a package that imports a sibling resolves it to nothing
      # and typecheck reports phantom TS2307s. A developer's tree always has a
      # stale `dist/` lying around, which hides this locally — it only ever
      # shows up in CI. `bun run --filter` builds in dependency order, so
      # building from nothing works.
      - name: Build packages
        run: bun run build
      # A package that generates code commits it under `src/generated/` —
      # `@nxgt/janus-mail` writes the e-mails' variables and locales there
      # from its Maizzle build. The build above rewrites it; a diff means the
      # committed copy is stale, and the code that sends type-checked against
      # a build that no longer exists.
      # `git diff` sees tracked files only: the status check also fails on a
      # generated file the build wrote and nobody committed.
      - name: Generated code is committed
        run: |
          git diff --exit-code -- 'packages/*/src/generated'
          test -z "$(git status --porcelain -- 'packages/*/src/generated')"
      - name: Type checking
        run: bun run typecheck
      # @nxgt/janus-mongo's specs start a real mongod, as a single-node replica
      # set, which is what `failCommand` needs, and so do @nxgt/janus-kit's,
      # from a copy of it. mongodb-memory-server downloads it on the first
      # start; the version is pinned in both files, which this key hashes, the
      # way nxgt-data keys its own.
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb
          key: mongod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/janus-mongo/test/server.ts', 'packages/janus-kit/test/mongo.ts') }}
      # @nxgt/janus-redis's specs start a real Redis, and so do
      # @nxgt/janus-kit's and @nxgt/janus-webhooks-redis's, from copies of the
      # same test/server.ts, pinned to the same version. Nobody publishes a
      # prebuilt redis-server, so redis-memory-server compiles the pinned
      # version — about two minutes, measured in nxgt-data — once, into this
      # cache, and in a step of its own so no test's timeout includes it.
      - name: Cache the Redis build
        uses: actions/cache@v4
        with:
          path: .cache/redis
          key: redis-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/janus-redis/test/server.ts', 'packages/janus-kit/test/server.ts', 'packages/janus-webhooks-redis/test/server.ts') }}
      - name: Build Redis
        run: bun -e "const { redisBinary } = await import('./packages/janus-redis/test/server.ts'); console.log(await redisBinary())"
      # Per package, then the scripts' own specs.
      - name: Run tests
        run: bun run test
        env:
          JANUS_POSTGRES_URL: postgres://postgres:janus@localhost:5432/postgres
      # The step above runs @nxgt/janus-drizzle over Bun's own SQL. Every
      # driver shapes results, dates and errors its own way — measured: a
      # `Date` in a `sql` template passes on Bun's SQL and on node-postgres,
      # and fails 7 cases on postgres.js — so each documented driver runs.
      - name: Run the PostgreSQL adapter over node-postgres and postgres.js
        working-directory: packages/janus-drizzle
        run: |
          JANUS_DRIVER=node-postgres bun test src
          JANUS_DRIVER=postgres-js bun test src
        env:
          JANUS_POSTGRES_URL: postgres://postgres:janus@localhost:5432/postgres
      # And on PGlite, which the README and the adapters guide say it passes
      # on, and which is what a contributor without a server runs: with no
      # JANUS_POSTGRES_URL, test/db.ts opens one PGlite per case. About three
      # minutes on the runner, two locally.
      - name: Run the PostgreSQL adapter on PGlite
        working-directory: packages/janus-drizzle
        run: bun test src
      # The build exits 0 on packages that throw the instant they are imported —
      # it happened three times in nxgt-core. This packs them, installs them as a consumer
      # does and imports every declared subpath.
      - name: Verify the built artifacts load
        run: bun run verify:artifacts
      # A change to a package without a changeset is a change that never
      # reaches a consumer: the release workflow has nothing to version.
      #
      # Except on the release branch itself. "Version packages" is the PR that
      # *consumes* the changesets: it rewrites every version, deletes the
      # `.changeset/*.md` that justified them, and so trips this check on its
      # own output. Requiring a changeset there would mean requiring one for
      # the act of releasing.
      #
      # And only on a pull request. On a push to `develop` the check compares
      # `develop` with `origin/develop`, which is an empty diff: measured on
      # changesets 3.0.3 it exits 0, so it cannot fail there — but it cannot
      # catch anything either, and a step that can only pass is one a reader
      # has to work out.
      - name: Changeset present
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'changeset-release/develop'
        run: bun run changeset:status

  # The minimum versions the READMEs promise — PostgreSQL 15, Redis 7.0, and
  # Valkey — measured rather than claimed: the job above runs PostgreSQL 17 and
  # Redis 7.4.1 only. It runs beside it, so the pull request waits for the
  # slower of the two and not their sum, and only the suites a floor concerns
  # run here: @nxgt/janus-drizzle, and @nxgt/janus-kit's one case over a
  # PostgreSQL URL — its other drizzle cases run on PGlite — on PostgreSQL
  # 15; @nxgt/janus-redis and @nxgt/janus-webhooks-redis on Redis 7.0 and on
  # Valkey; and @nxgt/janus-kit's drizzle specs, whose Redis is real, on Redis
  # 7.0 as well, since it promises the same floor. Each floor is the newest patch of its line.
  #
  # A floor that fails here is not fixed by testing a newer version: the
  # README is then wrong, and that is a decision, not a CI change.
  floors:
    name: Floors
    # Pinned rather than ubuntu-latest: the Valkey binary below is built for
    # this release, and `latest` moves.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Read by test/server.ts, which compiles this version instead of its pin.
      JANUS_REDIS_VERSION: 7.0.15
      # Valkey publishes built binaries per Ubuntu release: `noble` is 24.04,
      # the runner pinned above, on x86_64, which the download step names. 7.2
      # is Valkey's first line — the fork of Redis 7.2.4 — so it is the oldest
      # Valkey the READMEs' "or Valkey" can mean. The hash is the tarball's,
      # checked before it is extracted; a new version needs a new hash.
      VALKEY_VERSION: 7.2.14
      VALKEY_SHA256: fdfbd077802f02aace92f8c611f1851cddc71642c70f64840a25892f0a709712
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: janus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      # Every package's `exports` points at `./dist/*`; see the job above.
      - name: Build packages
        run: bun run build
      # Keyed on the version, on the three copies of test/server.ts as the job
      # above is, and on bun.lock, which pins the redis-memory-server that
      # builds it — and apart from the job above's key: the two jobs build
      # different servers into the same `.cache/redis`.
      - name: Cache the Redis 7.0 build
        uses: actions/cache@v4
        with:
          path: .cache/redis
          key: redis-floor-${{ runner.os }}-${{ runner.arch }}-${{ env.JANUS_REDIS_VERSION }}-${{ hashFiles('packages/janus-redis/test/server.ts', 'packages/janus-kit/test/server.ts', 'packages/janus-webhooks-redis/test/server.ts', 'bun.lock') }}
      - name: Build Redis 7.0
        run: bun -e "const { redisBinary } = await import('./packages/janus-redis/test/server.ts'); console.log(await redisBinary())"
      - name: Cache the Valkey binary
        uses: actions/cache@v4
        with:
          path: .cache/valkey
          key: valkey-${{ runner.os }}-${{ runner.arch }}-${{ env.VALKEY_VERSION }}-${{ env.VALKEY_SHA256 }}
      - name: Download Valkey
        run: |
          dir=".cache/valkey/$VALKEY_VERSION"
          if [ ! -x "$dir/bin/valkey-server" ]; then
            f="$RUNNER_TEMP/valkey.tar.gz"
            curl -fsSL -o "$f" "https://download.valkey.io/releases/valkey-$VALKEY_VERSION-noble-x86_64.tar.gz"
            echo "$VALKEY_SHA256  $f" | sha256sum -c -
            mkdir -p "$dir"
            tar -xzf "$f" -C "$dir" --strip-components=1
          fi
          "$dir/bin/valkey-server" --version
      - name: Run the PostgreSQL adapter on PostgreSQL 15, over every driver
        working-directory: packages/janus-drizzle
        run: |
          bun test src
          JANUS_DRIVER=node-postgres bun test src
          JANUS_DRIVER=postgres-js bun test src
        env:
          JANUS_POSTGRES_URL: postgres://postgres:janus@localhost:5432/postgres
      - name: Run the kit's drizzle specs on Redis 7.0, and its URL case on PostgreSQL 15
        working-directory: packages/janus-kit
        run: bun test src/drizzle
        env:
          JANUS_POSTGRES_URL: postgres://postgres:janus@localhost:5432/postgres
      - name: Run the Redis adapters on Redis 7.0
        run: |
          (cd packages/janus-redis && bun test src)
          (cd packages/janus-webhooks-redis && bun test src)
      # `$REDIS_BIN` replaces the compiled Redis with this binary.
      - name: Run the Redis adapters on Valkey 7.2
        run: |
          export REDIS_BIN="$PWD/.cache/valkey/$VALKEY_VERSION/bin/valkey-server"
          (cd packages/janus-redis && bun test src)
          (cd packages/janus-webhooks-redis && bun test src)
